name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android SDK-licenties
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Versienaam
        run: |
          n=${{ github.run_number }}
          if [ "$n" -ge 111 ]; then echo "KIJK_VERSION=0.2.$((n-111))" >> $GITHUB_ENV; else echo "KIJK_VERSION=0.1.$n" >> $GITHUB_ENV; fi
      - name: Build
        run: gradle --no-daemon assembleRelease
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Kijk.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Kijk
          path: Kijk.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Kijk ${{ env.KIJK_VERSION }}
          files: Kijk.apk
